<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
      data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>DHCP Leases</title>
  <link rel="stylesheet" href="../../static/lib/bootstrap/5.3.3/css/bootstrap.min.css"
        th:href="@{/lib/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" href="../../static/lib/bootstrap-social/5.1.1/bootstrap-social.css"
        th:href="@{/lib/bootstrap-social/5.1.1/bootstrap-social.css}"/>
  <link rel="stylesheet" href="../../static/lib/fontawesome/6.5.2/css/fontawesome.min.css"
        th:href="@{/lib/fontawesome/6.5.2/css/fontawesome.css}"/>
  <link rel="stylesheet" href="../../static/lib/fontawesome/6.5.2/css/brands.min.css"
        th:href="@{/lib/fontawesome/6.5.2/css/brands.min.css}"/>
  <link rel="stylesheet" href="../../static/lib/fontawesome/6.5.2/css/solid.min.css"
        th:href="@{/lib/fontawesome/6.5.2/css/solid.min.css}"/>
  <link rel="stylesheet" href="../../static/css/app.css"
        th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="../../static/css/glyphicons.css"
        th:href="@{/css/glyphicons.css}"/>
  <script src="../../static/lib/jquery/jquery-3.7.1.min.js"
          th:src="@{/lib/jquery/jquery-3.7.1.min.js}"></script>
  <script src="../../static/lib/popper/2.11.8/popper.min.js"
          th:src="@{/lib/popper/2.11.8/popper.min.js}"></script>
  <script src="../../static/lib/jquery-typewatch.js"
          th:src="@{/lib/jquery-typewatch.js}"></script>
  <script src="../../static/lib/bootstrap/5.3.3/js/bootstrap.min.js"
          th:src="@{/lib/bootstrap/5.3.3/js/bootstrap.min.js}"></script>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top"
     th:replace="~{fragments/header :: header}">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">bremersee.org</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
    </div>
  </div>
</nav>
<main role="main" class="container">

  <div th:replace="~{fragments/loading-spinner :: loading-spinner}"></div>

  <div class="row mb-4">
    <div class="col-1">
      <a class="btn btn-outline-secondary" href="home.html"
         th:href="@{../admin}">
        <span class="fa fa-backward"></span>
      </a>
    </div>
    <div class="col">
      <div class="container">
        <div class="d-flex justify-content-center">
          <h3>DHCP Leases</h3>
        </div>
      </div>
    </div>
    <div class="col-1"></div>
  </div>

  <!--suppress ThymeleafVariablesResolveInspection -->
  <div th:if="${rmsg != null}"
       class="alert alert-success"
       th:class="${rmsg != null} ? ${rmsg.msgType.cssClass} : ''" role="alert"
       th:text="${rmsg != null} ? ${rmsg.msg} : ''">
    Status message
  </div>

  <div class="mx-0 mx-sm-1 mx-md-3">
    <div class="mb-3 p-3 border border-1">
      <div class="row justify-content-between">
        <div class="col col-auto w-75">
          <div class="row g-3 align-items-center">
            <div class="col-auto">
              <div class="input-group">
                <!--suppress HtmlFormInputWithoutLabel -->
                <input type="text" id="q" name="q" class="form-control"
                       placeholder="Search ..."
                       th:value="${q}">
                <span class="input-group-text">
                <a id="searchInputSubmit" href="#" title="Search">
                  <span class="glyphicon glyphicon-search text-primary" aria-hidden="true"></span>
                </a>
              </span>
                <span class="input-group-text" th:if="${not #strings.isEmpty(q)}">
                <a id="searchInputReset" href="#" title="Reset search" class="show-spinner"
                   th:href="@{${currentPage}(page=0,size=${size},sort=${sort})}"
                   th:classappend="${#strings.isEmpty(q)} ? 'disabled' : ''"
                   th:disabled="${#strings.isEmpty(q)}"
                   th:aria-disabled="${#strings.isEmpty(q)}">
                  <span class="glyphicon glyphicon-remove text-danger" aria-hidden="true"></span>
                </a>
              </span>
              </div>
            </div>
          </div>
        </div>
        <div class="col col-auto mt-sm-2 mt-md-0">
        </div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(dhcpLeasePage.content)}"
         class="alert alert-info" role="alert">
      No dhcp leases were found.
    </div>

    <div class="list-group list-group-flush" th:if="${not #lists.isEmpty(dhcpLeasePage.content)}">
      <a th:each="entry,iter : ${dhcpLeasePage.content}" href="dns-entry-edit.html"
         th:href="@{dhcp-leases(ip=${entry.ip},page=${page},size=${size},sort=${sort},q=${q})}"
         class="list-group-item list-group-item-action show-spinner">
        <div class="row">
          <div class="col col-3 col-sm-3 col-md-2 col-lg-2 col-xl-2 col-xxl-2 me-1">
            <span>IP</span>:
          </div>
          <div class="col col-auto" th:text="${entry.ip}">
            192.168.1.112
          </div>
          <div class="col flex-column">
            <div class="d-flex p-1 justify-content-end">
              <span class="fa fa-edit" aria-hidden="true"></span>
            </div>
          </div>
        </div>
        <div class="small text-secondary">
          <div class="row">
            <div class="col col-3 col-sm-3 col-md-2 col-lg-2 col-xl-2 col-xxl-2 me-1">
              Hostname:
            </div>
            <div class="col col-auto" th:text="${entry.hostname}">
              zander
            </div>
          </div>
          <div class="row">
            <div class="col col-3 col-sm-3 col-md-2 col-lg-2 col-xl-2 col-xxl-2 me-1">
              Mac:
            </div>
            <div class="col col-auto" th:text="${entry.mac}">
              ab:ab:ab:ab
            </div>
          </div>
          <div class="row">
            <div class="col col-3 col-sm-3 col-md-2 col-lg-2 col-xl-2 col-xxl-2 me-1">
              Manufacturer:
            </div>
            <div class="col col-auto" th:text="${entry.manufacturer}">
              Apple
            </div>
          </div>
          <div class="row">
            <div class="col col-3 col-sm-3 col-md-2 col-lg-2 col-xl-2 col-xxl-2 me-1">
              Begin:
            </div>
            <div class="col col-auto" th:text="${#temporals.format(entry.begin, #locale)}">
              2014-11-23
            </div>
          </div>
          <div class="row">
            <div class="col col-3 col-sm-3 col-md-2 col-lg-2 col-xl-2 col-xxl-2 me-1">
              End:
            </div>
            <div class="col col-auto" th:text="${#temporals.format(entry.end, #locale)}">
              2014-11-23
            </div>
          </div>
        </div>
      </a>
    </div>

    <nav aria-label="Page navigation example" th:if="${@paginationHelper.getTotalPages(dhcpLeasePage) > 1}">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number - 3)}">
          <a class="page-link show-spinner" href="#" aria-label="First"
             th:href="@{${currentPage}(page=0,size=${size},sort=${sort},q=${q})}">
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>
        <li class="page-item"
            th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number - 5)}">
          <a class="page-link show-spinner" href="#" aria-label="Previous"
             th:href="@{${currentPage}(page=${dhcpLeasePage.number - 5},size=${size},sort=${sort},q=${q})}">
            <span aria-hidden="true">&mldr;</span>
          </a>
        </li>
        <li class="page-item"
            th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number - 2)}">
          <a class="page-link show-spinner" href="#" th:text="${dhcpLeasePage.number - 1}"
             th:href="@{${currentPage}(page=${dhcpLeasePage.number - 2},size=${size},sort=${sort},q=${q})}">
            1
          </a>
        </li>
        <li class="page-item" th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number - 1)}">
          <a class="page-link show-spinner" href="#" th:text="${dhcpLeasePage.number}"
             th:href="@{${currentPage}(page=${dhcpLeasePage.number - 1},size=${size},sort=${sort},q=${q})}">
            2
          </a>
        </li>
        <li class="page-item disabled">
          <a class="page-link" href="#" th:text="${dhcpLeasePage.number + 1}">
            3
          </a>
        </li>
        <li class="page-item"
            th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number + 1)}">
          <a class="page-link show-spinner" href="#" th:text="${dhcpLeasePage.number + 2}"
             th:href="@{${currentPage}(page=${dhcpLeasePage.number + 1},size=${size},sort=${sort},q=${q})}">
            4
          </a>
        </li>
        <li class="page-item"
            th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number + 2)}">
          <a class="page-link show-spinner" href="#" th:text="${dhcpLeasePage.number + 3}"
             th:href="@{${currentPage}(page=${dhcpLeasePage.number + 2},size=${size},sort=${sort},q=${q})}">
            5
          </a>
        </li>
        <li class="page-item"
            th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number + 5)}">
          <a class="page-link show-spinner" href="#" aria-label="Next"
             th:href="@{${currentPage}(page=${dhcpLeasePage.number + 5},size=${size},sort=${sort},q=${q})}">
            <span aria-hidden="true">&mldr;</span>
          </a>
        </li>
        <li class="page-item"
            th:if="${@paginationHelper.isValidPageNumber(dhcpLeasePage, dhcpLeasePage.number + 3)}">
          <a class="page-link show-spinner" href="#" aria-label="Last"
             th:href="@{${currentPage}(page=${@paginationHelper.getTotalPages(dhcpLeasePage) - 1},size=${size},sort=${sort},q=${q})}">
            <span aria-hidden="true">&raquo;</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

</main>
<script type="text/javascript" th:inline="javascript">
  //<![CDATA[
  "use strict";
  $(document).ready(function () {
    const currentPage = /*[[${currentPage}]]*/ "dhcp-leases";
    const size = /*[[${size}]]*/ "";
    const sort = /*[[${sort}]]*/ "";
    const lastSearchValue = /*[[${q}]]*/ "";
    const searchInput = $('#q');

    const loadingSpinnerModal = new bootstrap.Modal('#loadingSpinnerModal');
    $('a.show-spinner').on('click', function () {
      loadingSpinnerModal.show();
    });

    function search() {
      const value = searchInput.val();
      if (value !== lastSearchValue) {
        loadingSpinnerModal.show();
        window.location.href = currentPage
            + "?page=0"
            + "&size=" + size
            + "&sort=" + encodeURIComponent(sort)
            + "&q=" + encodeURIComponent(searchInput.val());
      }
    }
    searchInput.on('keypress', function (e) {
      if (e.which === 13) {
        search();
      }
    });
    $('#searchInputSubmit')
    .on('click', function () {
      search();
    });

  });
  //]]>
</script>
</body>
</html>
